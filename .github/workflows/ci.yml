name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore OmniChannelPlatform.slnx
      - run: dotnet build OmniChannelPlatform.slnx --no-restore --configuration Release
      - run: dotnet test OmniChannelPlatform.slnx --no-build --configuration Release --verbosity normal
